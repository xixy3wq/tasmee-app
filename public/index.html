<style>
/* Layout: a quiet working ledger — sticky header with role tabs, one centered column, cards only for things you act on. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --sunk:#e9efec; --ink:#16302a; --muted:#5b6f68; --line:#d8e2dd;
  --accent:#1c6a5a; --accent-ink:#ffffff; --accent-soft:#dcece7; --gold:#a8771f; --gold-soft:#f5ead2;
  --ok:#2c7a4b; --ok-soft:#dff0e5; --warn:#a56a12; --warn-soft:#f7ebd3; --bad:#b0413a; --bad-soft:#f6e0de; --info:#2f5f8f; --info-soft:#e0eaf4;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1614; --surface:#15201d; --sunk:#1b2925; --ink:#e2ece8; --muted:#93a8a0; --line:#25352f;
  --accent:#55b59f; --accent-ink:#06221b; --accent-soft:#1d3a33; --gold:#d8aa52; --gold-soft:#3a2f18;
  --ok:#62c38a; --ok-soft:#183427; --warn:#e2a64e; --warn-soft:#3a2c14; --bad:#e57a6f; --bad-soft:#3b1f1c; --info:#7fb1e0; --info-soft:#1a2b3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#15201d; --sunk:#1b2925; --ink:#e2ece8; --muted:#93a8a0; --line:#25352f;
  --accent:#55b59f; --accent-ink:#06221b; --accent-soft:#1d3a33; --gold:#d8aa52; --gold-soft:#3a2f18;
  --ok:#62c38a; --ok-soft:#183427; --warn:#e2a64e; --warn-soft:#3a2c14; --bad:#e57a6f; --bad-soft:#3b1f1c; --info:#7fb1e0; --info-soft:#1a2b3c; color-scheme:dark}
*{box-sizing:border-box}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.tabs::-webkit-scrollbar{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;padding:7px 14px;border-radius:8px;cursor:pointer;text-decoration:none;line-height:1.4;white-space:nowrap}
.btn:hover{border-color:var(--accent)}

form{display:grid;gap:12px}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:.85rem;font-weight:600;color:var(--muted)}
.fld i{color:var(--bad);font-style:normal}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.92rem}
.days{display:flex;flex-wrap:wrap;gap:6px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}

td.num,th.num{text-align:center}
.center-box{max-width:440px;margin:0 auto;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.hero-mark{display:flex;align-items:center;gap:12px}
.hero-mark svg{width:44px;height:44px;flex:none}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--sunk);border-radius:var(--r);display:grid;gap:8px;justify-items:center}
.note{padding:10px 12px;border-radius:8px;background:var(--gold-soft);color:var(--ink);font-size:.88rem}
.note.info{background:var(--info-soft)}
.now{border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.now .name{font-weight:700;font-size:1.05rem}
.qnum{width:26px;height:26px;border-radius:50%;background:var(--sunk);display:inline-grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted);flex:none}
.session-hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.datebox{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 14px;text-align:center;line-height:1.2;flex:none}
.datebox b{display:block;font-family:var(--f-display);font-size:1.5rem}
.datebox span{font-size:.8rem}
.join-card{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:16px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.join-card .grow{flex:1 1 200px;min-width:0}
.grade-preview{font-family:var(--f-display);font-size:1.1rem}
#modal{position:fixed;inset:0;z-index:20;background:rgba(10,20,17,.45);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));direction:rtl;overflow-y:auto}
.dlg{background:var(--surface);color:var(--ink);border-radius:14px;width:min(560px,100%);padding:20px;display:grid;gap:14px;max-height:calc(100dvh - 32px);overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:30;font-size:.92rem;max-width:calc(100% - 32px);direction:rtl}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
.banner{background:var(--warn-soft);color:var(--ink);font-size:.82rem;text-align:center;padding:6px 16px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.fields-tbl td{white-space:normal}
.back{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:0;display:inline-flex;gap:4px;align-items:center}
.back:hover{color:var(--accent)}
@media (max-width:560px){h1{font-size:1.35rem}.plan-row{grid-template-columns:1fr;gap:2px}}
</style>

<body>

<div id="root"><div id="app"></div></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
document.documentElement.lang = 'ar';

/* ---------------- Quran data ---------------- */
const SN = "الفاتحة|البقرة|آل عمران|النساء|المائدة|الأنعام|الأعراف|الأنفال|التوبة|يونس|هود|يوسف|الرعد|إبراهيم|الحجر|النحل|الإسراء|الكهف|مريم|طه|الأنبياء|الحج|المؤمنون|النور|الفرقان|الشعراء|النمل|القصص|العنكبوت|الروم|لقمان|السجدة|الأحزاب|سبأ|فاطر|يس|الصافات|ص|الزمر|غافر|فصلت|الشورى|الزخرف|الدخان|الجاثية|الأحقاف|محمد|الفتح|الحجرات|ق|الذاريات|الطور|النجم|القمر|الرحمن|الواقعة|الحديد|المجادلة|الحشر|الممتحنة|الصف|الجمعة|المنافقون|التغابن|الطلاق|التحريم|الملك|القلم|الحاقة|المعارج|نوح|الجن|المزمل|المدثر|القيامة|الإنسان|المرسلات|النبأ|النازعات|عبس|التكوير|الانفطار|المطففين|الانشقاق|البروج|الطارق|الأعلى|الغاشية|الفجر|البلد|الشمس|الليل|الضحى|الشرح|التين|العلق|القدر|البينة|الزلزلة|العاديات|القارعة|التكاثر|العصر|الهمزة|الفيل|قريش|الماعون|الكوثر|الكافرون|النصر|المسد|الإخلاص|الفلق|الناس".split('|');
const AYAS = [7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
const SSTART = []; let TOTAL = 0;
AYAS.forEach((n, i) => { SSTART[i] = TOTAL; TOTAL += n; });
const SUR = new Int16Array(TOTAL);
AYAS.forEach((n, s) => { for (let a = 0; a < n; a++) SUR[SSTART[s] + a] = s; });
const W = new Float64Array(TOTAL).fill(604 / TOTAL); // pages per ayah (approx until real page data loads)
let PAGES_OK = false;
function buildOrder(dir) {
  const arr = new Int32Array(TOTAL); let k = 0;
  const ss = dir === 'fwd' ? [...Array(114).keys()] : [...Array(114).keys()].reverse();
  ss.forEach(s => { for (let a = 0; a < AYAS[s]; a++) arr[k++] = SSTART[s] + a; });
  const pos = new Int32Array(TOTAL); arr.forEach((g, i) => pos[g] = i);
  return { ord: arr, pos };
}
const ORD = { fwd: buildOrder('fwd'), bwd: buildOrder('bwd') };
const gOf = (surah, ayah) => SSTART[surah - 1] + ayah - 1; // surah, ayah are 1-based
async function loadPages() {
  try {
    const mod = await import('https://cdn.jsdelivr.net/npm/quran-meta@6.0.17/+esm');
    let get = mod.getAyahMeta || (mod.default && mod.default.getAyahMeta);
    if (!get && mod.QuranRiwaya) { const h = mod.QuranRiwaya.hafs(); get = i => h.getAyahMeta(i); }
    if (!get) throw new Error('no api');
    const P = new Int16Array(TOTAL);
    for (let i = 0; i < TOTAL; i++) P[i] = get(i + 1).page;
    if (P[0] !== 1 || P[TOTAL - 1] !== 604) throw new Error('bad data');
    const cnt = new Int16Array(606); P.forEach(p => cnt[p]++);
    for (let i = 0; i < TOTAL; i++) W[i] = 1 / cnt[P[i]];
    PAGES_OK = true; scheduleRender();
  } catch (e) { PAGES_OK = false; }
}

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => isoDate(new Date());
const addDays = (ds, n) => { const d = new Date(ds + 'T00:00'); d.setDate(d.getDate() + n); return isoDate(d); };
const DAYN = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const fmtDate = ds => { if (!ds) return ''; const d = new Date(ds + 'T00:00'); return DAYN[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); };
const fmtTime = t => { if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h < 12 ? 'ص' : 'م'; h = h % 12 || 12; return h + ':' + pad(m) + ' ' + ap; };
const clock = ts => { const d = new Date(ts); return fmtTime(pad(d.getHours()) + ':' + pad(d.getMinutes())); };
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
function deepMerge(a, b) { const o = clone(a); for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) o[k] = deepMerge(o[k], b[k]); else o[k] = b[k]; } return o; }
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
async function hashPw(user, pw) {
  const txt = String(user).toLowerCase() + ':' + pw;
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch { let h = 5381; for (const c of txt) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'x' + (h >>> 0).toString(16); }
}
function normPhone(p) {
  let d = String(p || '').replace(/[^\d]/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('05') && d.length === 10) d = '966' + d.slice(1);
  else if (d.startsWith('5') && d.length === 9) d = '966' + d;
  return d;
}
const waLink = (phone, text) => { const p = normPhone(phone); return p ? 'https://wa.me/' + p + '?text=' + encodeURIComponent(text) : ''; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }

/* ---------------- store ---------------- */
const COLS = ['users', 'halaqat', 'sessions', 'recs', 'joins', 'settings'];
const S = {}; COLS.forEach(c => S[c] = {});
let READY = false, SETUP = false, OFFLINE = false;
async function api(op, payload = {}) {
  let r;
  try { r = await fetch('/api', { method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ op, ...payload }) }); }

  'del-session': el => confirmBox('تحذف الحصة؟ التسميع المسجّل فيها يبقى في سجل الطلاب.', 'حذف', () => run(async () => { await del('sessions', el.dataset.id); go('sessions'); }, 'حُذفت الحصة')),
  'att': el => { const s = curSession(); const cur = (s.att || {})[el.dataset.id]; const v = cur === el.dataset.v ? null : el.dataset.v; run(() => patch('sessions', s.id, { att: { [el.dataset.id]: v } })); },
  'att-joined': () => { const s = curSession(); const att = {}; L('joins').filter(j => j.sid === s.id).forEach(j => { if (!(s.att || {})[j.uid]) att[j.uid] = 'p'; }); if (!Object.keys(att).length) return toast('ما فيه أحد دخل من الموقع بعد'); run(() => patch('sessions', s.id, { att }), 'تم تحضير ' + Object.keys(att).length); },
  'att-rest': () => { const s = curSession(); const att = {}; studentsOf(s.halqaId).forEach(x => { if (!(s.att || {})[x.id]) att[x.id] = 'a'; }); if (!Object.keys(att).length) return toast('كل الطلاب محضّرون'); run(() => patch('sessions', s.id, { att })); },
  'q-add': () => { const id = $('#q-pick').value; if (!id) return; const s = curSession(); clean(); run(() => patch('sessions', s.id, { queue: [...(s.queue || []), id] })); },
  'q-all': () => { const s = curSession(); const q = [...(s.queue || [])]; studentsOf(s.halqaId).forEach(x => { const v = (s.att || {})[x.id]; if ((v === 'p' || v === 'l') && !q.includes(x.id) && x.id !== s.current) q.push(x.id); }); run(() => patch('sessions', s.id, { queue: q })); },
  'q-up': el => { const s = curSession(); const q = [...s.queue]; const i = +el.dataset.i; if (i > 0) { [q[i - 1], q[i]] = [q[i], q[i - 1]]; run(() => patch('sessions', s.id, { queue: q })); } },
  'q-down': el => { const s = curSession(); const q = [...s.queue]; const i = +el.dataset.i; if (i < q.length - 1) { [q[i + 1], q[i]] = [q[i], q[i + 1]]; run(() => patch('sessions', s.id, { queue: q })); } },
  'q-rm': el => { const s = curSession(); const q = [...s.queue]; q.splice(+el.dataset.i, 1); run(() => patch('sessions', s.id, { queue: q })); },
  'q-next': () => { const s = curSession(); const q = [...(s.queue || [])]; const nx = q.shift() || null; run(() => patch('sessions', s.id, { queue: q, current: nx })); },
  'rec': el => recModal(el.dataset.id, ST.sid),
  'del-rec': el => confirmBox('تحذف هذا التسميع؟ (الخطة التلقائية ما ترجع للخلف)', 'حذف', () => run(() => del('recs', el.dataset.id), 'حُذف')),
  'join': el => { const u = me(); const id = el.dataset.id + '_' + u.id; if (!S.joins[id]) run(() => put('joins', id, { sid: el.dataset.id, uid: u.id, at: Date.now() })); },
  'copy': el => copyText(el.dataset.text),
  'copy-reg': el => copyText(regLink(el.dataset.h)),
  'retry': () => { OFFLINE = false; render(); safeSync(); },
  'approve': el => { const id = el.dataset.id; const hid = $('#ap-h-' + id).value; run(() => patch('users', id, { status: 'active', halqaId: hid, approvedAt: Date.now() }), 'تم اعتماد الطالب'); },
  'reject': el => confirmBox('تحذف طلب التسجيل؟', 'حذف الطلب', () => run(() => del('users', el.dataset.id), 'حُذف الطلب')),
  'add-student': () => { if (!L('halaqat').length) return toast('أنشئ حلقة أولًا'); studentModal(null); },
  'edit-student': el => studentModal({ ...S.users[el.dataset.id], id: el.dataset.id }),
  'del-user': el => confirmBox('تحذف هذا الحساب نهائيًا؟', 'حذف', () => run(async () => { await del('users', el.dataset.id); if (ST.view === 'student') go('students'); }, 'حُذف الحساب')),
  'add-teacher': () => teacherModal(null),
  'edit-teacher': el => teacherModal({ ...S.users[el.dataset.id], id: el.dataset.id }),
  'add-halqa': () => halqaModal(null),
  'edit-halqa': el => halqaModal({ ...S.halaqat[el.dataset.id], id: el.dataset.id }),
  'del-halqa': el => { const n = studentsOf(el.dataset.id).length; if (n) { closeModal(); return toast('انقل طلاب الحلقة (' + n + ') لحلقة ثانية قبل حذفها'); } confirmBox('تحذف الحلقة؟', 'حذف', () => run(() => del('halaqat', el.dataset.id), 'حُذفت الحلقة')); },
  'edit-plan': el => planModal({ ...S.users[el.dataset.id], id: el.dataset.id }),
  'sf-add': () => openModal(`${dlgHead('إضافة حقل تسجيل')}<form data-form="sf-add"><label class="fld"><span>اسم الحقل</span><input name="label" required placeholder="مثال: الحي"></label><label class="fld"><span>النوع</span><select name="type"><option value="text">نص</option><option value="tel">رقم جوال</option><option value="number">رقم</option></select></label><label class="check"><input type="checkbox" name="req"> إجباري</label><div class="dlg-foot"><button class="btn pri" type="submit">إضافة</button></div></form>`),
  'sf-del': el => { const st = SET(); run(() => put('settings', 'main', { ...st, fields: st.fields.filter(f => f.k !== el.dataset.k) })); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'A') e.preventDefault();
  fn(el, e);
});

const CHG = {
  'filter-h': el => { ST.halqa = el.value; delete el.dataset.dirty; render(); },
  'student-auto': el => { delete el.dataset.dirty; run(() => patch('users', el.dataset.id, { autoAllowed: el.checked }), el.checked ? 'سُمح بالخطة التلقائية' : 'أُلغي السماح بالخطة التلقائية'); },
  't-perm': el => { delete el.dataset.dirty; run(() => patch('users', el.dataset.id, { [el.dataset.k]: el.checked }), 'تم تحديث الصلاحية'); },
  'plan-mode': el => { const auto = el.value === 'auto' && el.checked; $('#pm-auto').hidden = !auto; $('#pm-manual').hidden = auto; },
  'rec-type': el => { const s = window.__recPlan[el.value]; $('#rc-hint').innerHTML = window.__recExtra(el.value); if (s) { $('#rc-surah').value = s.s + 1; $('#rc-from').value = s.a1; $('#rc-to').value = s.a2; } },
  'rec-surah': () => { const n = AYAS[+$('#rc-surah').value - 1]; if (n) { $('#rc-from').max = n; $('#rc-to').max = n; } },
};
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el, e); });
const INP = {
  'grade': () => { const g = gradeOf($('#rc-m').value, $('#rc-a').value); $('#rc-grade').innerHTML = `<span class="chip ${g.k}">${g.t}</span>`; },
  'search': el => { ST.q = el.value; clearTimeout(INP.t); INP.t = setTimeout(render, 200); },
};
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && INP[el.dataset.input]) INP[el.dataset.input](el, e); });

/* ---------------- forms ---------------- */
const FORMS = {
  async setup(f, d) {
    if (await run(() => api('setup', { center: d.get('center'), name: d.get('name'), username: d.get('username'), password: d.get('password') }))) { clean(); ST.view = null; await safeSync(); }
  },
  async login(f, d) {
    try { await api('login', { username: d.get('username'), password: d.get('password') }); } catch (e) { return toast(e.userMsg); }
    ST.view = null; clean(); await safeSync();
  },
  async register(f, d) {
    const body = { name: d.get('name'), username: d.get('username'), password: d.get('password'), reqHalqa: f.dataset.hid || d.get('reqHalqa') || '' };
    SET().fields.filter(x => x.on).forEach(x => { body[x.k] = (d.get(x.k) || '').trim(); });
    if (await run(() => api('register', body))) { clean(); ST.regDone = true; render(); }
  },
  async session(f, d) {
    const id = f.dataset.id; const data = { date: d.get('date'), time: d.get('time'), link: (d.get('link') || '').trim(), note: (d.get('note') || '').trim() };
    if (id) { if (await run(() => patch('sessions', id, data), 'حُفظت الحصة')) closeModal(); }
    else { const nid = newId(); if (await run(() => put('sessions', nid, { ...data, halqaId: d.get('halqaId'), att: {}, queue: [], current: null }), 'أُنشئت الحصة')) { closeModal(); go('session', { sid: nid }); } }
  },
  async rec(f, d) {
    const uid = f.dataset.uid, sid = f.dataset.sid; const sur = +d.get('surah'); const n = AYAS[sur - 1];
    const from = +d.get('from'), to = +d.get('to');
    if (!n) return toast('اختر السورة');
    if (from < 1 || to < from || to > n) return toast('تأكد من أرقام الآيات (سورة ' + SN[sur - 1] + ' عدد آياتها ' + n + ')');
    const m = +d.get('mistakes') || 0, al = +d.get('alerts') || 0; const g = gradeOf(m, al);
    const ses = S.sessions[sid];
    const rec = { uid, sid, halqaId: ses ? ses.halqaId : '', date: ses ? ses.date : today(), type: d.get('type'), surah: sur, from, to, mistakes: m, alerts: al, grade: g.t, pass: g.pass, note: (d.get('note') || '').trim(), at: Date.now() };
    if (await run(() => put('recs', newId(), rec), 'سُجّل التسميع: ' + g.t)) closeModal();
  },
  async student(f, d) {
    const id = f.dataset.id;
    const data = { name: d.get('name').trim(), username: d.get('username').trim(), halqaId: d.get('halqaId'), status: d.get('status') };
    SET().fields.forEach(x => { data[x.k] = (d.get(x.k) || '').trim(); });
    if (d.get('password')) data.password = d.get('password');
    const ok = id ? await run(() => patch('users', id, data), 'حُفظت البيانات') : await run(() => put('users', newId(), { ...data, role: 'student' }), 'أُضيف الطالب');
    if (ok) closeModal();
  },
  async teacher(f, d) {
    const id = f.dataset.id;
    const data = { name: d.get('name').trim(), username: d.get('username').trim(), phone: (d.get('phone') || '').trim(), canPlan: !!d.get('canPlan'), canAuto: !!d.get('canAuto') };
    if (id) data.status = d.get('status');
    if (d.get('password')) data.password = d.get('password');
    const ok = id ? await run(() => patch('users', id, data), 'حُفظ') : await run(() => put('users', newId(), { ...data, role: 'teacher' }), 'أُضيف المعلم');
    if (ok) closeModal();
  },
  async halqa(f, d) {
    const id = f.dataset.id; const data = { name: d.get('name').trim(), teacherId: d.get('teacherId') || '', days: d.getAll('day').map(Number), time: d.get('time') || '' };
    if (!data.days.length) return toast('اختر يوم دوام واحد على الأقل');
    const ok = id ? await run(() => patch('halaqat', id, data), 'حُفظت الحلقة') : await run(() => put('halaqat', newId(), data), 'أُنشئت الحلقة');
    if (ok) closeModal();
  },
  async plan(f, d) {
    const id = f.dataset.id; const st = { ...S.users[id], id }; const old = planOf(st); const u = me();
    const mode = d.get('mode') === 'auto' && canAutoU(u) && st.autoAllowed ? 'auto' : 'manual';
    const manual = {};
    for (const k of ['new', 'review', 'tath']) { const s = +d.get('m-' + k + '-s'); if (!s) continue; const n = AYAS[s - 1]; const fr = +d.get('m-' + k + '-f') || 1, to = +d.get('m-' + k + '-t') || n; if (fr > n || to > n || fr > to) return toast('آيات ' + TYPE[k] + ' غير صحيحة (سورة ' + SN[s - 1] + ': ' + n + ' آية)'); manual[k] = { surah: s, from: fr, to }; }
    let auto = old.auto;
    if (mode === 'auto') {
      const dir = d.get('dir') === 'fwd' ? 'fwd' : 'bwd'; const ss = +d.get('startS'); const sa = +d.get('startA') || 1;
      if (!ss || sa > AYAS[ss - 1]) return toast('تأكد من موضع بداية الحفظ');
      const np = ORD[dir].pos[gOf(ss, sa)];
      auto = { dir, newPos: np, revPos: (dir === old.auto.dir && np === old.auto.newPos) ? old.auto.revPos : 0, newAmt: +d.get('newAmt'), revAmt: +d.get('revAmt'), tathAmt: +d.get('tathAmt') };
    }
    const plan = { mode, manual, auto };
    if (await run(async () => { S.users[id] = { ...S.users[id], plan }; await patch('users', id, { plan }); }, 'حُفظت الخطة')) closeModal();
  },
  async settings(f, d) {
    const st = SET(); const days = d.getAll('day').map(Number);
    if (!days.length) return toast('اختر يوم دوام واحد على الأقل');
    const fields = st.fields.map(x => ({ ...x, label: (d.get('lb-' + x.k) || x.label).trim() || x.label, on: !!d.get('on-' + x.k), req: !!d.get('req-' + x.k) && !!d.get('on-' + x.k) }));
    const ns = { center: d.get('center').trim() || DEF.center, days, fields, grade: { ex: +d.get('ex') || 0, vg: +d.get('vg') || 0, gd: +d.get('gd') || 0, alertsPer: Math.max(1, +d.get('alertsPer') || 3) }, tpl: { absent: d.get('absent'), excellent: d.get('excellent') } };
    if (!(ns.grade.ex <= ns.grade.vg && ns.grade.vg <= ns.grade.gd)) return toast('حدود التقدير لازم تكون متصاعدة');
    if (await run(() => put('settings', 'main', { ...st, ...ns }), 'حُفظت الإعدادات')) clean();
  },
  async 'sf-add'(f, d) {
    const st = SET(); const nf = { k: 'c_' + newId(), label: d.get('label').trim(), type: d.get('type'), on: true, req: !!d.get('req'), custom: true };
    if (await run(() => put('settings', 'main', { ...st, fields: [...st.fields, nf] }), 'أُضيف الحقل')) closeModal();
  },
  async mypw(f, d) {
    if (await run(() => api('mypw', { old: d.get('old'), pw: d.get('pw') }), 'تم تغيير كلمة المرور')) closeModal();
  },
};
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const btn = f.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  Promise.resolve(FORMS[f.dataset.form](f, new FormData(f))).finally(() => { if (btn && btn.isConnected) btn.disabled = false; });
});
window.addEventListener('hashchange', () => render());

/* ---------------- boot ---------------- */
render();
loadPages();
safeSync();
setInterval(() => { if (document.visibilityState === 'visible' && !syncing) safeSync(); }, 6000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') safeSync(); });
</script>
</body>
</html>
